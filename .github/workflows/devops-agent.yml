name: DevOps Agent
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
      issue_title:
        description: 'Issue title'
        required: true
      issue_body:
        description: 'Issue body'
        required: false
        default: ''
jobs:
  run-devops-agent:
    name: Implement DevOps Changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'devops'
    permissions:
      issues: write
      contents: write
      pull-requests: write
      actions: write
      models: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Create feature branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin
          BRANCH="feature/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code origin "$BRANCH"; then
            echo "Branch $BRANCH already exists — checking it out"
            git checkout -b "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            echo "Created branch $BRANCH"
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Run devops-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/devops-darkfactory.agent.md
          model: openai/gpt-4o-mini
          prompt: |
            Repository  : ${{ github.repository }}
            Issue number: ${{ github.event.issue.number || inputs.issue_number }}
            Issue title : ${{ github.event.issue.title || inputs.issue_title }}
            Issue body  :
            ${{ github.event.issue.body || inputs.issue_body }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.COPILOT_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch next stage
        uses: ./.github/actions/dispatch-next-stage
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}
          issue_title:  ${{ github.event.issue.title || inputs.issue_title }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
