name: DevOps Agent

on:
  issues:
    types: [labeled]

jobs:
  run-devops-agent:
    name: Implement DevOps Changes
    if: github.event.label.name == 'devops'
    permissions:
      issues: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/_run-single-agent.yml
    with:
      agent: .github/agents/devops-darkfactory.agent.md
      issue_number: ${{ github.event.issue.number }}
      issue_title:  ${{ github.event.issue.title }}
      issue_body:   ${{ github.event.issue.body }}
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
