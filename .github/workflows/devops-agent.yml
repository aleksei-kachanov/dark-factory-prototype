name: DevOps Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

jobs:
  run-devops-agent:
    name: Implement DevOps Changes
    runs-on: ubuntu-latest
    # Trigger either by the `devops` label or by the /devops-agent proceed comment
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'devops') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/devops-agent proceed'))
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Run devops-agent
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/devops-agent.yml
          context: |
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
            Issue body   :
            ${{ github.event.issue.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
