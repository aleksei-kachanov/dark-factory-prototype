name: DevOps Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
      issue_title:
        description: 'Issue title'
        required: true
      issue_body:
        description: 'Issue body'
        required: false
        default: ''

jobs:
  run-devops-agent:
    name: Implement DevOps Changes
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'devops'
    permissions:
      issues: write
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Run devops-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/devops-darkfactory.agent.md
          prompt: |
            Issue number : ${{ github.event.issue.number || inputs.issue_number }}
            Issue title  : ${{ github.event.issue.title || inputs.issue_title }}
            Issue body   :
            ${{ github.event.issue.body || inputs.issue_body }}
          max-tokens: 16000
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch next stage
        uses: ./.github/actions/dispatch-next-stage
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}
          issue_title:  ${{ github.event.issue.title || inputs.issue_title }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
