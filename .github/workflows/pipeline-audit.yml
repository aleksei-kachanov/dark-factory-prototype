name: Pipeline Audit
on:
  schedule:
    - cron: '0 9 * * *'   # daily at 09:00 UTC
  workflow_dispatch:
jobs:
  audit:
    name: Daily Pipeline Audit
    runs-on: ubuntu-latest
    permissions:
      issues: read
      contents: read
      discussions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run pipeline-audit-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/pipeline-audit-darkfactory.agent.md
          model: openai/gpt-4o-mini
          prompt: |
            Repository: ${{ github.repository }}
            Audit date: ${{ github.event.schedule && 'scheduled' || 'manual' }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
