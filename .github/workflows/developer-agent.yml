name: Developer Agent

on:
  issues:
    types: [labeled]

jobs:
  implement-feature:
    name: Implement Feature (Backend → Frontend)
    runs-on: ubuntu-latest
    if: github.event.label.name == 'tests-ready'
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-${{ github.event.issue.number }}
          fetch-depth: 0

      # ── Backend setup ─────────────────────────────────────────────────────
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # ── Frontend setup ────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dark-factory-ui/package-lock.json

      - name: Install frontend dependencies
        run: cd dark-factory-ui && npm ci

      # ── Step 1: Backend developer agent ──────────────────────────────────
      # Implements C# production code to make xUnit tests pass.
      # Posts DoD with DTO contract changes for the frontend agent to read.
      - name: Run backend developer-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/developer-backend-darkfactory.agent.md
          prompt: |
            Issue number  : ${{ github.event.issue.number }}
            Issue title   : ${{ github.event.issue.title }}
            Feature branch: feature/issue-${{ github.event.issue.number }}
          max-tokens: 16000
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 2: Frontend developer agent ─────────────────────────────────
      # Reads backend DoD for DTO changes, syncs TypeScript types, implements
      # UI features, validates with tsc + vite build.
      # Adds label `implementation-done` when done, which triggers Pass 2.
      - name: Run frontend developer-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/developer-frontend-darkfactory.agent.md
          prompt: |
            Issue number  : ${{ github.event.issue.number }}
            Issue title   : ${{ github.event.issue.title }}
            Feature branch: feature/issue-${{ github.event.issue.number }}
          max-tokens: 16000
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
