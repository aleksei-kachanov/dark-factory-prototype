name: Developer Agent
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
      issue_title:
        description: 'Issue title'
        required: true
jobs:
  implement-feature:
    name: Implement Feature (Backend → Frontend)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'tests-ready'
    permissions:
      issues: write
      contents: write
      actions: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/issue-${{ github.event.issue.number || inputs.issue_number }}
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dark-factory-ui/package-lock.json
      - name: Install frontend dependencies
        run: cd dark-factory-ui && npm ci
      - name: Run backend developer-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/developer-backend-darkfactory.agent.md
          token: ${{ secrets.COPILOT_TOKEN }}
          prompt: |
            Repository    : ${{ github.repository }}
            Issue number  : ${{ github.event.issue.number || inputs.issue_number }}
            Issue title   : ${{ github.event.issue.title || inputs.issue_title }}
            Feature branch: feature/issue-${{ github.event.issue.number || inputs.issue_number }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.COPILOT_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run frontend developer-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/developer-frontend-darkfactory.agent.md
          token: ${{ secrets.COPILOT_TOKEN }}
          prompt: |
            Repository    : ${{ github.repository }}
            Issue number  : ${{ github.event.issue.number || inputs.issue_number }}
            Issue title   : ${{ github.event.issue.title || inputs.issue_title }}
            Feature branch: feature/issue-${{ github.event.issue.number || inputs.issue_number }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.COPILOT_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch next stage
        uses: ./.github/actions/dispatch-next-stage
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}
          issue_title:  ${{ github.event.issue.title || inputs.issue_title }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
