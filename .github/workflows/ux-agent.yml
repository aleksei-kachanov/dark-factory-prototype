name: UX Designer Agent

on:
  issues:
    types: [labeled]

jobs:
  design-ux:
    name: Produce UX Specification
    runs-on: ubuntu-latest
    if: github.event.label.name == 'planned'
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Create the feature branch from main if it doesn't already exist.
      # Convention: feature/issue-<N>. All subsequent agents (testing, developer,
      # Pass 2) check out this branch by name — the workflow owns branch creation,
      # not the agent.
      - name: Create feature branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin
          BRANCH="feature/issue-${{ github.event.issue.number }}"
          if git ls-remote --exit-code origin "$BRANCH"; then
            echo "Branch $BRANCH already exists — skipping creation"
          else
            git checkout -b "$BRANCH"
            git push origin "$BRANCH"
            echo "Created branch $BRANCH"
          fi

      # Produces docs/ux/<issue-number>.md if frontend changes are in scope,
      # or posts a no-UI note if not. Adds label `ux-ready` in both cases,
      # which unblocks the testing-agent Pass 1 job.
      - name: Run UX designer agent
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/ux-designer-darkfactory.agent.md
          context: |
            Issue number  : ${{ github.event.issue.number }}
            Issue title   : ${{ github.event.issue.title }}
            Issue body    :
            ${{ github.event.issue.body }}
            Feature branch: feature/issue-${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
