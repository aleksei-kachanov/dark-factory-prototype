name: Testing Agent

on:
  issues:
    types: [labeled]

jobs:
  # ── Pass 1: write failing tests (backend then frontend) ─────────────────────
  # Triggered by `ux-ready` (set by ux-designer-agent after UX spec is produced).
  # Label `tests-ready` is added ONLY by the frontend testing agent at the end
  # of this job (after both agents have finished). This prevents the developer
  # workflow from firing before frontend tests exist.
  write-failing-tests:
    name: Write Failing Tests (Pass 1)
    runs-on: ubuntu-latest
    if: github.event.label.name == 'ux-ready'
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dark-factory-ui/package-lock.json

      - name: Install frontend dependencies
        run: cd dark-factory-ui && npm ci

      # Step 1: Backend testing agent creates the feature branch and writes
      # failing xUnit tests. Does NOT add label or update workflow-state stage.
      - name: Run backend testing-agent — Pass 1
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/testing-backend-darkfactory.agent.md
          context: |
            Pass         : 1 (write failing backend tests)
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
            Issue body   :
            ${{ github.event.issue.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Frontend testing agent writes failing Vitest tests, then — as
      # the last action of this job — adds label `tests-ready`. Only at this
      # point is the developer workflow allowed to start.
      - name: Run frontend testing-agent — Pass 1
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/testing-frontend-darkfactory.agent.md
          context: |
            Pass         : 1 (write failing frontend tests — add tests-ready label at end)
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
            Issue body   :
            ${{ github.event.issue.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Pass 2: review coverage, then coordinate PR ──────────────────────────────
  review-coverage-and-pr:
    name: Review Coverage and Create PR (Pass 2)
    runs-on: ubuntu-latest
    if: github.event.label.name == 'implementation-done'
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dark-factory-ui/package-lock.json

      - name: Install frontend dependencies
        run: cd dark-factory-ui && npm ci

      # Capture full diff (backend + frontend) for the blind reviewer
      - name: Capture diff for blind reviewer
        id: diff
        run: |
          DIFF=$(git diff origin/main...HEAD)
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$DIFF" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Gate 1: Blind reviewer — code quality, structural checks, TS↔C# DTO sync.
      # Receives diff only. Outputs: Blind Review Report with findings by layer.
      - name: Run blind reviewer
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/reviewer-darkfactory.agent.md
          context: |
            ${{ steps.diff.outputs.diff }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 2: PO verifier — plan compliance, AC satisfaction, endpoint existence.
      # Receives issue number. Outputs: PO Verification Report.
      - name: Run PO verifier
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/po-verifier-darkfactory.agent.md
          context: |
            Issue number : ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 3: UX reviewer — checks five-state component coverage, interaction
      # patterns, accessibility, and data contract against docs/ux/<N>.md.
      # Outputs: UX Review Report. Verdict: UX_APPROVED / UX_CHANGES_REQUESTED / UX_SKIPPED.
      - name: Run UX reviewer
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/ux-reviewer-darkfactory.agent.md
          context: |
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 4: Backend testing agent Pass 2 — xUnit coverage only.
      # Does not read reviewer/PO verdicts. Outputs: Backend Testing DoD.
      - name: Run backend testing-agent — Pass 2
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/testing-backend-darkfactory.agent.md
          context: |
            Pass         : 2 (backend coverage review only — do not read reviewer or PO verdicts)
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 5: Frontend testing agent Pass 2 — Vitest coverage only.
      # Does not read reviewer/PO verdicts and does not open PR.
      # Outputs: Frontend Testing DoD.
      - name: Run frontend testing-agent — Pass 2
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/testing-frontend-darkfactory.agent.md
          context: |
            Pass         : 2 (frontend coverage review only — do not read reviewer or PO verdicts, do not open PR)
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Gate 6: PR Coordinator — reads all five gate outputs, decides go/no-go.
      # On ROUTE_BACK: posts layered findings comment, re-labels tests-ready.
      # On OPEN_PR: opens PR, adds review-ready label.
      - name: Run PR coordinator
        uses: actions/ai-inference@v1
        with:
          agent: .github/agents/pr-coordinator-darkfactory.agent.md
          context: |
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
