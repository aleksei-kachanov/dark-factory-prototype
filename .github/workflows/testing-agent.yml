name: CI — Backend & Frontend Tests

on:
  pull_request:
    branches: [main, enrich_agents]
  push:
    branches: [enrich_agents, 'feature/**']

jobs:
  test-backend:
    name: Backend Tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - run: dotnet test DarkFactory.slnx --logger "console;verbosity=minimal"

  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dark-factory-ui/package-lock.json
      - run: cd dark-factory-ui && npm ci
      - run: cd dark-factory-ui && npm test -- --run
