name: Telemetry Agent
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
      issue_title:
        description: 'Issue title'
        required: true
jobs:
  record-telemetry:
    name: Record Pipeline Telemetry
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'review-ready'
    permissions:
      issues: read
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run telemetry-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/telemetry-darkfactory.agent.md
          token: ${{ secrets.COPILOT_TOKEN }}
          prompt: |
            Repository  : ${{ github.repository }}
            Issue number: ${{ github.event.issue.number || inputs.issue_number }}
            Issue title : ${{ github.event.issue.title || inputs.issue_title }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.COPILOT_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
