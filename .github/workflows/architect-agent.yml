name: Architect Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
      issue_title:
        description: 'Issue title'
        required: false
        default: ''
      issue_body:
        description: 'Issue body (WHAT spec)'
        required: false
        default: ''

jobs:
  produce-technical-design:
    name: Produce Technical Design
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'spec-ready' ||
      github.event.label.name == 'plan-challenged'
    permissions:
      issues: write
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run architect-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/architect-darkfactory.agent.md
          prompt: |
            Repository  : ${{ github.repository }}
            Issue number: ${{ github.event.issue.number || inputs.issue_number }}
            Issue title : ${{ github.event.issue.title || inputs.issue_title }}
            Issue body  :
            ${{ github.event.issue.body || inputs.issue_body }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch next stage
        uses: ./.github/actions/dispatch-next-stage
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}
          issue_title:  ${{ github.event.issue.title || inputs.issue_title }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
