name: Architect Agent

on:
  issues:
    types: [labeled]

jobs:
  produce-technical-design:
    name: Produce Technical Design
    runs-on: ubuntu-latest
    if: |
      github.event.label.name == 'spec-ready' ||
      github.event.label.name == 'plan-challenged'
    permissions:
      issues: write
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run architect-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/architect-darkfactory.agent.md
          prompt: |
            Issue number : ${{ github.event.issue.number }}
            Issue title  : ${{ github.event.issue.title }}
            Issue body   :
            ${{ github.event.issue.body }}
          max-tokens: 16000
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch next stage
        uses: ./.github/actions/dispatch-next-stage
        with:
          issue_number: ${{ github.event.issue.number }}
          issue_title:  ${{ github.event.issue.title }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
