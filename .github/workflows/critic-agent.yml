name: Critic Agent

on:
  issues:
    types: [labeled]

jobs:
  challenge-plan:
    name: Challenge Implementation Plan
    runs-on: ubuntu-latest
    if: github.event.label.name == 'plan-ready'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run critic-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/critic-darkfactory.agent.md
          prompt: |
            Issue number : ${{ github.event.issue.number }}
          max-tokens: 8000
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
