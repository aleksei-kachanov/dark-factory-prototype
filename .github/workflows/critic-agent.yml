name: Critic Agent
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to challenge'
        required: true
      issue_title:
        description: 'Issue title'
        required: true
jobs:
  challenge-plan:
    name: Challenge Implementation Plan
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'plan-ready'
    permissions:
      issues: write
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run critic-agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: .github/agents/critic-darkfactory.agent.md
          model: openai/gpt-4o-mini
          prompt: |
            Repository  : ${{ github.repository }}
            Issue number: ${{ github.event.issue.number || inputs.issue_number }}
            Issue title : ${{ github.event.issue.title || inputs.issue_title }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch next stage
        uses: ./.github/actions/dispatch-next-stage
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}
          issue_title:  ${{ github.event.issue.title || inputs.issue_title }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
