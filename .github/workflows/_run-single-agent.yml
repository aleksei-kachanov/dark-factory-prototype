name: Run Single Agent (reusable)
# Reusable workflow for any pipeline step that runs one agent against one issue.
# Callers supply the agent path and any optional tool setup (dotnet, node).
# This eliminates structural duplication between devops-agent.yml and future
# single-agent workflows.

on:
  workflow_call:
    inputs:
      agent:
        required: true
        type: string
        description: "Path to the .agent.md file, e.g. .github/agents/devops-darkfactory.agent.md"
      issue_number:
        required: true
        type: string
      issue_title:
        required: true
        type: string
      extra_context:
        required: false
        type: string
        default: ""
      max_tokens:
        required: false
        type: number
        default: 16000
      dotnet_version:
        required: false
        type: string
        default: "8.x"
      node_version:
        required: false
        type: string
        default: ""          # empty = skip Node.js setup
      fetch_depth:
        required: false
        type: number
        default: 0
    secrets:
      github_token:
        required: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Setup Node.js
        if: inputs.node_version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'
          cache-dependency-path: dark-factory-ui/package-lock.json

      - name: Install frontend dependencies
        if: inputs.node_version != ''
        run: cd dark-factory-ui && npm ci

      - name: Run agent
        uses: actions/ai-inference@v1
        with:
          system-prompt-file: ${{ inputs.agent }}
          prompt: |
            Issue number : ${{ inputs.issue_number }}
            Issue title  : ${{ inputs.issue_title }}
            ${{ inputs.extra_context }}
          max-tokens: ${{ inputs.max_tokens }}
          enable-github-mcp: true
          github-mcp-token: ${{ secrets.github_token }}
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}
