name: Build, Test and Deploy to Azure Functions

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_NAME: 'dark-factory-app'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: DarkFactory.Weather
  DOTNET_VERSION: '10.x'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DarkFactory.slnx

      - name: Build solution
        run: dotnet build DarkFactory.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DarkFactory.slnx --configuration Release --no-build --verbosity normal

      - name: Publish application
        run: dotnet publish ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }} --configuration Release --no-build --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish

  deploy:
    name: Deploy to Azure Functions
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_002E671A515E4E66AF9623B11CA532ED }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Skip deploy — Azure credentials not configured
        if: env.AZURE_CLIENT_ID == ''
        run: |
          echo "::notice::Azure secrets not configured — skipping deploy. Add AZUREAPPSERVICE_* secrets to enable."
          exit 0

      - name: Download publish artifact
        if: env.AZURE_CLIENT_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: ./publish

      - name: Login to Azure
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_002E671A515E4E66AF9623B11CA532ED }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0257611D103D48F4A9AD3D2B8F49DEBE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_48A3ED5489A34540836C2B562E4EE282 }}

      - name: Deploy to Azure Functions
        if: env.AZURE_CLIENT_ID != ''
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          slot-name: 'Production'
          package: ./publish
