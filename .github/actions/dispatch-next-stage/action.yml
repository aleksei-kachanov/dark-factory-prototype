name: Dispatch Next Pipeline Stage
description: >
  Reads the current labels on an issue and dispatches the appropriate next
  workflow on the same branch. Used at the end of every agent workflow to
  chain stages automatically without requiring a merge to main.

inputs:
  issue_number:
    description: 'Issue number'
    required: true
  issue_title:
    description: 'Issue title'
    required: true
  github_token:
    description: 'GitHub token with actions:write scope'
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch next stage
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ISSUE_TITLE: ${{ inputs.issue_title }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -e

        LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null || echo "")
        echo "Issue #$ISSUE_NUMBER labels: $LABELS"
        echo "Current branch: $BRANCH"

        dispatch() {
          local workflow="$1"
          shift
          echo "→ $workflow"
          if ! gh workflow run "$workflow" --ref "$BRANCH" "$@"; then
            echo "::error::dispatch-next-stage: failed to trigger $workflow for issue #$ISSUE_NUMBER"
            exit 1
          fi
        }

        label_exact() {
          echo "$LABELS" | grep -qE "(^|,)$1(,|$)"
        }

        if label_exact "spec-ready"; then
          dispatch architect-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif label_exact "plan-ready"; then
          dispatch critic-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif label_exact "plan-challenged"; then
          dispatch architect-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif label_exact "devops"; then
          dispatch devops-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif label_exact "planned"; then
          dispatch ux-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif label_exact "ux-ready"; then
          dispatch testing-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE" -f pass=1

        elif label_exact "tests-ready"; then
          dispatch developer-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif label_exact "implementation-done"; then
          dispatch testing-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE" -f pass=2

        elif label_exact "fix-ready"; then
          dispatch fixer-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif label_exact "review-ready"; then
          dispatch telemetry-agent.yml -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        else
          echo "→ No dispatch (rejected / needs-clarification — human review needed)"
        fi
