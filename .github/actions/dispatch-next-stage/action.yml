name: Dispatch Next Pipeline Stage
description: >
  Reads the current labels on an issue and dispatches the appropriate next
  workflow on the same branch. Used at the end of every agent workflow to
  chain stages automatically without requiring a merge to main.

inputs:
  issue_number:
    description: 'Issue number'
    required: true
  issue_title:
    description: 'Issue title'
    required: true
  github_token:
    description: 'GitHub token with actions:write scope'
    required: true

runs:
  using: composite
  steps:
    - name: Dispatch next stage
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ISSUE_TITLE: ${{ inputs.issue_title }}
        BRANCH: ${{ github.ref_name }}
      run: |
        LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels -q '[.labels[].name] | join(",")' 2>/dev/null || echo "")
        echo "Issue #$ISSUE_NUMBER labels: $LABELS"
        echo "Current branch: $BRANCH"

        if echo "$LABELS" | grep -q "plan-ready"; then
          echo "→ critic-agent"
          gh workflow run critic-agent.yml --ref "$BRANCH" \
            -f issue_number="$ISSUE_NUMBER"

        elif echo "$LABELS" | grep -q "devops"; then
          echo "→ devops-agent"
          gh workflow run devops-agent.yml --ref "$BRANCH" \
            -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif echo "$LABELS" | grep -q "planned"; then
          echo "→ ux-agent"
          gh workflow run ux-agent.yml --ref "$BRANCH" \
            -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif echo "$LABELS" | grep -q "ux-ready"; then
          echo "→ testing-agent pass=1"
          gh workflow run testing-agent.yml --ref "$BRANCH" \
            -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE" -f pass=1

        elif echo "$LABELS" | grep -q "tests-ready"; then
          echo "→ developer-agent"
          gh workflow run developer-agent.yml --ref "$BRANCH" \
            -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        elif echo "$LABELS" | grep -q "implementation-done"; then
          echo "→ testing-agent pass=2"
          gh workflow run testing-agent.yml --ref "$BRANCH" \
            -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE" -f pass=2

        elif echo "$LABELS" | grep -q "review-ready"; then
          echo "→ telemetry-agent"
          gh workflow run telemetry-agent.yml --ref "$BRANCH" \
            -f issue_number="$ISSUE_NUMBER" -f issue_title="$ISSUE_TITLE"

        else
          echo "→ No dispatch (rejected / needs-clarification / plan-challenged — human review needed)"
        fi
